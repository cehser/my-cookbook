name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Nur PRs abbrechen. Auf main laufen Läufe nacheinander (ein wartender
  # älterer Lauf wird vom neueren ersetzt), damit publish nie mitten im
  # Push der :main-Tags abbricht und ein gemischtes Paar hinterlässt.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dummy-Werte: die Tests prüfen keine Tokens gegen einen echten IdP
  OIDC_AUTHORITY: https://idp.example.invalid/realms/ci
  OIDC_CLIENT_ID: ci

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # wie frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8 # wie backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # DB-Tests laufen im Job backend-db
      - run: uv run pytest -m "not db"

  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine # Major wie docker-compose.yml.example
        env:
          POSTGRES_DB: test_cookbook
          POSTGRES_USER: cookbook
          # Sonderzeichen prüfen die URL-Kodierung (config.database_url, alembic/env.py)
          POSTGRES_PASSWORD: 'p@ss:w/rd#%?'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cookbook -d test_cookbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: test_cookbook
      DB_USER: cookbook
      DB_PASSWORD: 'p@ss:w/rd#%?'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # -rs zeigt übersprungene Tests: ein stilles Überspringen würde die Prüfung aushöhlen
      - run: uv run pytest -m db -rs

  # Pull Requests: Images nur bauen. Auf main baut publish (kein doppelter Build).
  images:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull frontend
      - run: docker build --pull backend

  # Push auf main: nach allen Prüfungen bauen und nach ghcr.io pushen.
  # Erst beide Builds, dann alle Pushes; :main zuletzt und nur, wenn dieser
  # Lauf noch den Kopf von main baut (Re-run eines älteren Laufs: nur SHA-Tags).
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, backend-db]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Namen und Tags
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}" # ghcr verlangt Kleinschreibung
          {
            echo "PREFIX=ghcr.io/${owner}/my-cookbook"
            echo "SHORT_SHA=${GITHUB_SHA::7}" # wie git rev-parse --short
          } >> "$GITHUB_ENV"
      - name: Images bauen
        run: |
          for svc in frontend backend; do
            docker build --pull --platform linux/amd64 \
              --build-arg "COMMIT_HASH=${SHORT_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${PREFIX}-${svc}:${SHORT_SHA}" \
              -t "${PREFIX}-${svc}:main" \
              "$svc"
          done
      - name: Login ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Images pushen
        env:
          GH_TOKEN: ${{ github.token }} # gh api, contents: read genügt
        run: |
          for svc in frontend backend; do docker push "${PREFIX}-${svc}:${SHORT_SHA}"; done
          # Scheitert die Abfrage, bricht der Schritt ab (bash -e); :main bleibt dann unverändert.
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::warning::main steht auf ${head::7}, dieser Lauf baut ${SHORT_SHA}: nur SHA-Tags gepusht, :main unverändert"
            exit 0
          fi
          for svc in frontend backend; do docker push "${PREFIX}-${svc}:main"; done
      - name: Logout
        if: always()
        run: docker logout ghcr.io
