[project]
name = "my-cookbook-backend"
version = "0.1.0"
description = "FastAPI-Backend des Familien-Kochbuchs"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Framework
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    # Database
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    # Auth
    "pyjwt>=2.15",
    "cryptography>=50.0",
    # Validation & Settings
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    # Image Processing
    "pillow>=13.0",
    # AI
    "openai>=2.29,<3",
    # YAML (Migrationsskripte, entfällt mit W.8)
    "pyyaml>=6.0",
    # Utils
    "python-multipart>=0.0.33",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# backend/alembic/ (Migrationen) ist kein eigenes Paket
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-Abhängigkeiten als Default-Argument sind das vorgesehene Muster
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Migrationsskripte entfallen mit W.8; "from app.models import Base" lädt bewusst alle Modelle
"scripts/*" = ["F401"]
# Migrationen sind Historie und werden nicht mehr geändert (lange SQL-Zeilen)
"alembic/versions/*" = ["E501"]
