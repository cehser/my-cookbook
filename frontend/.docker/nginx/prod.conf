server {
  listen 80;
  server_name _ default_server;

  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # PWA-Manifest mit eigenem Typ (sonst application/octet-stream)
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  # API-Proxy zum Backend (root_path="/api" bleibt erhalten)
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10M;
  }

  # AI-Import: Websuche und Bildanalyse dauern. Das Backend bricht OpenAI nach
  # 120 s ab (OPENAI_TIMEOUT_S), nginx wartet länger, damit dessen Meldung
  # ankommt. Bis zu 10 Seiten je Anfrage: Upload-Grenze = MAX_TOTAL_MB in
  # backend/app/routes/ai.py (20 MB, je Bild 10 MB).
  # Ohne URI in proxy_pass bleibt der Pfad (inkl. /api) unverändert.
  location /api/v1/ai/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    client_max_body_size 20M;
  }
}
